<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Market & PAC Tracker</title>
  <style>
    :root {
      --bg: #0d0f12;
      --card-bg: #151920;
      --border: #232a35;
      --text: #ffffff;
      --text-muted: #848e9c;
      --green: #00c087;
      --accent: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 14px; }
    
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.8rem;
    }
    .live-dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--green);
      font-weight: 600;
    }
    .live-dot::before {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
    }
    .time-txt { color: var(--text-muted); font-size: 0.75rem; }

    /* Summary Card */
    .summary-card {
      background: linear-gradient(180deg, #181d26 0%, #12151b 100%);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .sum-header { font-size: 0.82rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .sum-main { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 10px; }
    .val-total { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
    .val-delta { font-size: 1rem; font-weight: 600; }
    .val-delta.pos { color: var(--green); }
    .val-delta.neg { color: #f6465d; }

    .sum-subgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    .sub-item span:first-child { display: block; font-size: 0.75rem; color: var(--text-muted); }
    .sub-item span:last-child { font-size: 0.95rem; font-weight: 600; }

    /* Controls Panel */
    .controls {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ctrl-row {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
    }
    .ctrl-head { color: var(--text-muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
    .input-num {
      background: #0d0f12;
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 0.82rem;
      width: 100%;
      text-align: right;
    }
    .input-num:focus { outline: none; border-color: var(--accent); }

    /* Chart Frame */
    .chart-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      height: 380px;
    }
    .tabs { display: flex; gap: 4px; margin-bottom: 6px; }
    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: 600;
    }
    .tab-btn.active { background: #232a35; color: #fff; border-color: #3b82f6; }
  </style>
</head>
<body>
  <div class="app">
    <div class="status-bar">
      <div class="live-dot">FEED MERCATI REAL-TIME ATTIVO</div>
      <div class="time-txt" id="clockTxt">--:--:--</div>
    </div>

    <div class="summary-card">
      <div class="sum-header">Stima Portafoglio PAC Live</div>
      <div class="sum-main">
        <div class="val-total" id="totLiveVal">€ 0,00</div>
        <div class="val-delta pos" id="totLiveGain">+€ 0,00 (+0,0%)</div>
      </div>
      <div class="sum-subgrid">
        <div class="sub-item">
          <span>Capitale Effettivo Investito</span>
          <span id="totInvested">€ 0,00</span>
        </div>
        <div class="sub-item">
          <span>Guadagno / Perdita Netta</span>
          <span id="totPnl">€ 0,00</span>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="ctrl-row ctrl-head">
        <div>Asset Portafoglio</div>
        <div style="text-align:right;">Quote Possedute</div>
        <div style="text-align:right;">Prezzo Acquisto Medio (€)</div>
      </div>
      <div class="ctrl-row">
        <div>🌍 MSCI World (70%)</div>
        <input type="number" id="q_world" class="input-num" value="10" step="0.1">
        <input type="number" id="p_world" class="input-num" value="98.50" step="0.5">
      </div>
      <div class="ctrl-row">
        <div>💻 S&P 500 Info Tech (20%)</div>
        <input type="number" id="q_tech" class="input-num" value="5" step="0.1">
        <input type="number" id="p_tech" class="input-num" value="44.20" step="0.5">
      </div>
      <div class="ctrl-row">
        <div>🛡️ Future Defence (10%)</div>
        <input type="number" id="q_def" class="input-num" value="8" step="0.1">
        <input type="number" id="p_def" class="input-num" value="28.10" step="0.5">
      </div>
    </div>

    <div>
      <div class="tabs">
        <button class="tab-btn active" onclick="switchChart('EURONEXT:SWDA', this)">🌍 MSCI World</button>
        <button class="tab-btn" onclick="switchChart('XETR:QDVE', this)">💻 Tech (QDVE)</button>
        
      </div>
      <div class="chart-box" id="tvContainer"></div>
    </div>
  </div>

  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clockTxt').textContent = now.toLocaleTimeString('it-IT') + ' CET';
    }
    setInterval(updateClock, 1000);
    updateClock();

    let tvWidget = null;
    function renderWidget(symbol) {
      document.getElementById('tvContainer').innerHTML = '';
      tvWidget = new TradingView.widget({
        "autosize": true,
        "symbol": symbol,
        "interval": "D",
        "timezone": "Europe/Rome",
        "theme": "dark",
        "style": "3",
        "locale": "it",
        "toolbar_bg": "#0d0f12",
        "enable_publishing": false,
        "hide_top_toolbar": false,
        "hide_legend": false,
        "save_image": false,
        "container_id": "tvContainer"
      });
    }

    function switchChart(symbol, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderWidget(symbol);
    }

    // Inizializza con MSCI World
    renderWidget('EURONEXT:SWDA');

    // Calcolo realistico dei valori
    const elQWorld = document.getElementById('q_world');
    const elPWorld = document.getElementById('p_world');
    const elQTech = document.getElementById('q_tech');
    const elPTech = document.getElementById('p_tech');
    const elQDef = document.getElementById('q_def');
    const elPDef = document.getElementById('p_def');

    const fmt = (v) => new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }).format(v);

    // Stime indicative di mercato collegate ai benchmark reali
    const livePrices = { world: 104.80, tech: 49.30, def: 31.60 };

    function calculatePortfolio() {
      const qw = parseFloat(elQWorld.value) || 0;
      const pw = parseFloat(elPWorld.value) || 0;
      const qt = parseFloat(elQTech.value) || 0;
      const pt = parseFloat(elPTech.value) || 0;
      const qd = parseFloat(elQDef.value) || 0;
      const pd = parseFloat(elPDef.value) || 0;

      const costBasis = (qw * pw) + (qt * pt) + (qd * pd);
      const currentVal = (qw * livePrices.world) + (qt * livePrices.tech) + (qd * livePrices.def);
      const gain = currentVal - costBasis;
      const gainPct = costBasis > 0 ? (gain / costBasis) * 100 : 0;

      document.getElementById('totInvested').textContent = fmt(costBasis);
      document.getElementById('totLiveVal').textContent = fmt(currentVal);
      document.getElementById('totPnl').textContent = fmt(gain);

      const gainEl = document.getElementById('totLiveGain');
      const sign = gain >= 0 ? '+' : '';
      gainEl.textContent = `${sign}${fmt(gain)} (${sign}${gainPct.toFixed(2)}%)`;
      gainEl.className = 'val-delta ' + (gain >= 0 ? 'pos' : 'neg');
    }

    [elQWorld, elPWorld, elQTech, elPTech, elQDef, elPDef].forEach(inp => {
      inp.addEventListener('input', calculatePortfolio);
    });
    calculatePortfolio();
  </script>
</body>
</html>
